name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ICU for local builds
        if: env.ACT == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libicu-dev

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate export presets
        run: |
          TPL="$PWD/.github/workflows/export templates"
          cat > export_presets.cfg <<EOF
          [preset.0]

          name="Windows Custom"
          platform="Windows Desktop"
          export_filter="all_resources"
          include_filter="*html"
          exclude_filter="model/*,addons/csvedit/*,*.md, docs/*"
          script_export_mode=2

          [preset.0.options]

          custom_template/release="$TPL/godot.windows.template_release.x86_64.mono.exe"
          debug/export_console_wrapper=1
          binary_format/embed_pck=false
          texture_format/s3tc_bptc=true
          texture_format/etc2_astc=false
          binary_format/architecture="x86_64"
          dotnet/include_scripts_content=false
          dotnet/include_debug_symbols=true
          dotnet/embed_build_outputs=false

          [preset.1]

          name="Linux Custom"
          platform="Linux"
          export_filter="all_resources"
          include_filter="*html"
          exclude_filter="model/*,addons/csvedit/*,addons/spout-gd/*,*.md, docs/*"
          script_export_mode=2

          [preset.1.options]

          custom_template/release="$TPL/godot.linuxbsd.template_release.x86_64.mono"
          debug/export_console_wrapper=1
          binary_format/embed_pck=false
          texture_format/s3tc_bptc=true
          texture_format/etc2_astc=false
          binary_format/architecture="x86_64"
          dotnet/include_scripts_content=false
          dotnet/include_debug_symbols=true
          dotnet/embed_build_outputs=false
          EOF

      - name: Setup Godot and ffmpeg
        run: |
          DIR="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          BIN="$DIR/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip && chmod +x "$BIN"
          sudo ln -sf "$PWD/$BIN" /usr/local/bin/godot

          mkdir -p addons/ffmpeg/bin
          curl -sL -o ffmpeg-win.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-9.0.zip"
          unzip -qj ffmpeg-win.zip "*ffmpeg.exe" -d addons/ffmpeg/bin
          curl -sL -o ffmpeg-linux.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz"
          tar -xJf ffmpeg-linux.tar.xz -C addons/ffmpeg/bin --strip-components=2 "ffmpeg-n9.0-latest-linux64-gpl-9.0/bin/ffmpeg"
          chmod +x addons/ffmpeg/bin/ffmpeg

      - name: Build and export
        run: |
          dotnet build YAPS.csproj -c Debug
          godot --headless --import
          grep -q '&"C#"' .godot/global_script_class_cache.cfg || { echo "::error::global_script_class_cache.cfg is missing C# global classes; export would be broken"; exit 1; }
          mkdir -p builds/windows builds/linux
          godot --headless --export-release "Windows Custom" builds/windows/yaps.exe
          godot --headless --export-release "Linux Custom" builds/linux/yaps.x86_64
          find builds/linux -path "*addons/ffmpeg/bin/ffmpeg" -exec chmod +x {} \;

      - name: Prepare release
        id: prepare-release
        shell: bash
        run: |
          test -f builds/windows/yaps.exe || { echo "::error::Windows build not found"; exit 1; }
          test -f builds/linux/yaps.x86_64 || { echo "::error::Linux build not found"; exit 1; }
          VER="$(grep -m1 '^config/version=' project.godot | cut -d'"' -f2)"
          VER="${VER:-ci-${GITHUB_SHA::8}}"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Deploy to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          [ -n "${BUTLER_API_KEY:-}" ] || { echo "::error::BUTLER_API_KEY is not set (GitHub Secrets / .secrets no act)"; exit 1; }
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler-bin && chmod +x butler-bin/butler
          butler-bin/butler push builds/windows coffeesanvt/yaps:windows --userversion "$VER"
          butler-bin/butler push builds/linux coffeesanvt/yaps:linux --fix-permissions --userversion "$VER"

      - name: Notify Discord
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ env.DISCORD_WEBHOOK }}
          content: "<@&1557378706060607509>Nova versão **${{ env.VER }}** do YAPS no itch.io: https://coffeesanvt.itch.io/yaps"

      - name: Publish to GitHub Releases
        if: ${{ !cancelled() && steps.prepare-release.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VER"
          (cd builds/windows && zip -qr ../yaps-windows-x86_64.zip .)
          tar -czf builds/yaps-linux-x86_64.tar.gz -C builds/linux .
          ASSETS=(builds/yaps-windows-x86_64.zip builds/yaps-linux-x86_64.tar.gz)

          TAG_REFS="$(git ls-remote --sort=refname origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          TAG_COMMIT="$(awk 'END { print $1 }' <<< "$TAG_REFS")"
          if [[ -n "$TAG_COMMIT" && "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $TAG points to a different commit. Bump config/version in project.godot."
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "YAPS $VER" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
