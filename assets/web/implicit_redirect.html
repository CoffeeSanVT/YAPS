<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>YAPS - Twitch Authentication</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap');
        body { background: #2c2b2d; color: #f7dfd1; font-family: "Plus Jakarta Sans", system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #48444a; padding: 40px; border-radius: 12px; text-align: center; max-width: 400px; }
        h2 { font-family: "Bungee", system-ui; color: #f7dfd1; margin-bottom: 12px; }
        .spinner { width: 32px; height: 32px; border: 4px solid #555; border-top-color: #b39ddb; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 16px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { font-size: 14px; color: #f7dfd1; }
        .success { color: #81c784; }
        .error { color: #e57373; }
    </style>
</head>
<body>
    <div class="card">
        <h2>YAPS - Twitch</h2>
        <div id="spinner" class="spinner"></div>
        <p id="status" class="status">Connecting...</p>
    </div>
    <script>
        (function() {
            var hash = window.location.hash;
            if (!hash || hash.length < 2) {
                fail('No access token found.');
                return;
            }
            var params = new URLSearchParams(hash.substring(1));
            if (!params.get('access_token')) {
                fail('No access token found.');
                return;
            }
            fetch('/token?' + params.toString())
                .then(function(resp) {
                    finish(resp.ok);
                })
                .catch(function(err) {
                    fail(err.message);
                });

            function fail(message) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('status').className = 'status error';
                document.getElementById('status').textContent = message;
            }

            function finish(ok) {
                document.getElementById('spinner').style.display = 'none';
                if (ok) {
                    document.querySelector('h2').textContent = 'Authentication success';
                    document.getElementById('status').textContent = 'You can now return to YAPS.';
                    return;
                }
                document.getElementById('status').className = 'status error';
                document.getElementById('status').textContent = 'Failed to send token.';
            }
        })();
    </script>
</body>
</html>
